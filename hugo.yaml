baseURL: https://kieferland.dev/
title: Kiefer Land
theme: PaperMod
locale: en-US
timeZone: America/Los_Angeles

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

# Keep the existing post URLs (/writing/<filename>/)
permalinks:
  writing: /writing/:contentbasename/

# Keep the existing feed URL (/rss.xml instead of Hugo's default /index.xml)
outputFormats:
  rss:
    mediaType: application/rss+xml
    baseName: rss

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production
  description: I verify AI-built software.
  keywords: [qa, testing, ai, evals, appsec, verification]
  defaultTheme: auto
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowToc: true
  mainSections:
    - writing

  homeInfoParams:
    Title: Kiefer Land
    Content: I verify AI-built software before it breaks in front of paying users. AI Assurance Engineer. M.S. Cybersecurity. I write about testing AI systems — and run fixed-fee verification audits for founders shipping with AI. [Work with me →](/services/)

  socialIcons:
    - name: linkedin
      url: https://linkedin.com/in/kieferland
    - name: github
      url: https://github.com/kiefertaylorland    
    - name: reddit
      url: https://reddit.com/user/sutherlandsec
    - name: tryhackme
      url: https://tryhackme.com/p/sutherland

menu:
  main:
    - identifier: writing
      name: Writing
      url: /writing/
      weight: 10
    - identifier: services
      name: Services
      url: /services/
      weight: 15
    - identifier: about
      name: About
      url: /about/
      weight: 20

markup:
  goldmark:
    renderer:
      unsafe: false
  highlight:
    noClasses: false
